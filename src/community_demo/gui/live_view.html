<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>智慧社区 · 实时巡航</title>
<style>
body{background:#111827;color:#eef2ff;font:17px system-ui,sans-serif;margin:20px}h1{font-size:26px;margin:0 0 16px}
button{background:#263c56;color:white;border:1px solid #6685a6;border-radius:7px;padding:10px 18px;font:inherit;cursor:pointer}
main{display:grid;grid-template-columns:minmax(0,1280px) minmax(260px,1fr);gap:20px;margin-top:18px}
.camera{overflow:auto;border:1px solid #40536b;border-radius:8px}#camera{display:block;width:100%;height:auto}body.native #camera{width:1280px;max-width:none}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1f2937;padding:16px;margin:0;border-radius:8px;font:15px/1.6 monospace}
#detail{max-width:100%;image-rendering:pixelated}#detail-panel{background:#1f2937;padding:16px;margin-top:16px;border-radius:8px}
.note{color:#bdcde0;font-size:14px;margin:8px 0}@media(max-width:950px){main{grid-template-columns:1fr}}
</style>
<h1>智慧社区 · 机器人实际相机</h1>
<button onclick="restart()">再巡航一圈</button> <button onclick="document.body.classList.toggle('native')">原始尺寸 / 适应窗口</button>
<span id="restart-message"></span>
<main><section><div class="camera"><img id="camera" alt="等待机器人相机"></div><p class="note" id="stamp">等待同步图像与识别结果</p></section>
<aside><pre id="state">等待巡航数据</pre><section id="detail-panel" hidden><strong>当前车牌原始像素局部放大</strong><p class="note">放大用于查看，不增加图像细节，不参与识别。</p><img id="detail" alt="当前车牌"><p id="detail-text"></p></section><pre id="events" style="margin-top:16px"></pre></aside></main>
<script>
const category={resident:'社区人员',visitor:'非社区人员',plate:'车牌',traffic_light:'信号灯'};
async function restart(){const r=await(await fetch('/restart',{method:'POST'})).json();document.getElementById('restart-message').textContent=r.message;}
async function update(){try{const payload=await(await fetch('/snapshot',{cache:'no-store'})).json(),s=payload.report;
if(s&&s.counts){document.getElementById('camera').src='data:image/jpeg;base64,'+payload.image;
document.getElementById('stamp').textContent=`相机 1280×960 · 帧 ${s.frame_id} · 仿真时间 ${s.stamp.toFixed(2)} 秒 · 图像与下方事件来自同一快照`;
document.getElementById('state').textContent=s.status+'\n\n社区人员：'+s.counts.residents+'\n非社区人员：'+s.counts.visitors+'\n去重总人数：'+s.counts.total+'\n\n已确认车牌：\n'+Object.keys(s.plates).join('\n')+'\n\n未确认观察点：'+((s.unconfirmed_views||[]).join('、')||'无')+'\n\n灯态：'+s.traffic_light;
document.getElementById('events').textContent='最近确认事件\n'+(s.events||[]).slice(-6).map(e=>`#${e.sequence} ${e.display_name||(category[e.category]||e.category)+' '+e.content}\n置信度 ${e.confidence.toFixed(2)} · 帧 ${e.frame_id}`).join('\n');
document.getElementById('detail-panel').hidden=!s.detail||!payload.detail_image;
if(s.detail&&payload.detail_image){document.getElementById('detail').src='data:image/jpeg;base64,'+payload.detail_image;document.getElementById('detail-text').textContent=s.detail.text+(s.detail.ocr_confidence==null?'':' · OCR '+s.detail.ocr_confidence.toFixed(2));}
}}catch(error){document.getElementById('stamp').textContent='等待相机连接恢复';}setTimeout(update,100);}update();
</script></html>
